<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロストフルホールデム - タイトル</title>
<style>
  body { margin:0; font-family: "Hiragino Sans", sans-serif; background:#0a0a0a; color:#e5e5e5; height:100vh; }
  .screen { position:relative; width:100%; height:100vh; box-sizing:border-box; padding:24px; }
  .title { position:absolute; top:24px; left:24px; font-size:28px; color:#b91c1c; letter-spacing:2px; }
  .settings-icon { position:absolute; top:24px; right:24px; font-size:24px; cursor:pointer; }
  .name-input { position:absolute; top:80px; left:24px; }
  .name-input input { background:#1a1a1a; border:1px solid #444; color:#eee; padding:8px 12px; border-radius:4px; }
  .menu { position:absolute; top:50%; left:6%; transform:translateY(-50%); display:flex; flex-direction:column; gap:16px; }
  .menu button { background:#1a1a1a; border:1px solid #b91c1c; color:#eee; padding:16px 48px; font-size:16px; border-radius:6px; cursor:pointer; }
  .menu button:hover { background:#b91c1c33; }
  .credit { position:absolute; bottom:24px; right:24px; color:#777; font-size:12px; cursor:pointer; }
</style>
</head>
<body>
  <div class="screen">
    <div class="title">LOST FULL HOLDEM</div>
    <div class="settings-icon">⚙</div>
    <div class="name-input">
      <label style="font-size:12px;color:#999;">プレイヤー名</label><br>
      <input type="text" id="playerNameInput" placeholder="プレイヤー1" maxlength="10">
    </div>
    <div class="menu">
      <button onclick="goTo('room-create.html')">AI戦</button>
      <button onclick="goTo('room-create.html')">ルーム作成</button>
      <button onclick="goTo('room-join.html')">ルーム参加</button>
    </div>
    <div class="credit">Credit</div>
  </div>
  <script>
    function goTo(url) {
      const input = document.getElementById('playerNameInput');
      const name = input.value.trim() || input.placeholder;
      localStorage.setItem('playerName', name);
      location.href = url;
    }
  </script>
</body>
</html>
