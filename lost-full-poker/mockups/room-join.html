<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロストフルホールデム - ルーム参加</title>
<style>
  body { margin:0; font-family: "Hiragino Sans", sans-serif; background:#0a0a0a; color:#e5e5e5; display:flex; align-items:center; justify-content:center; height:100vh; }
  .panel { background:#141414; border:1px solid #333; border-radius:10px; padding:24px; width:280px; text-align:center; }
  .code-display { font-size:28px; letter-spacing:8px; background:#1a1a1a; border:1px solid #444; border-radius:6px; padding:10px; margin-bottom:16px; min-height:20px; }
  .keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .keypad button { background:#1a1a1a; border:1px solid #444; color:#eee; padding:14px; font-size:16px; border-radius:6px; cursor:pointer; }
  .actions { display:flex; flex-direction:column; gap:8px; }
  .actions button { padding:10px; border-radius:6px; cursor:pointer; }
  .confirm { background:#b91c1c33; border:1px solid #b91c1c; color:#eee; }
  .clear, .back { background:#1a1a1a; border:1px solid #666; color:#eee; }
</style>
</head>
<body>
  <div class="panel">
    <div class="code-display">____</div>
    <div class="keypad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button>クリア</button><button>0</button><button>決定</button>
    </div>
    <div class="actions">
      <button class="back">戻る</button>
    </div>
  </div>
</body>
</html>
