<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロストフルホールデム - ルーム参加</title>
<style>
  body { margin:0; font-family: "Hiragino Sans", sans-serif; background:#0a0a0a; color:#e5e5e5; display:flex; align-items:center; justify-content:center; height:100vh; }
  .panel { background:#141414; border:1px solid #333; border-radius:10px; padding:24px; width:300px; text-align:center; }
  .code-input { width:100%; box-sizing:border-box; font-size:20px; letter-spacing:2px; text-align:center; background:#1a1a1a; border:1px solid #444; color:#eee; border-radius:6px; padding:12px; margin-bottom:8px; }
  .hint { font-size:11px; color:#777; margin-bottom:16px; }
  .error { font-size:12px; color:#e05252; min-height:16px; margin-bottom:8px; }
  .actions { display:flex; flex-direction:column; gap:8px; }
  .actions button { padding:12px; border-radius:6px; cursor:pointer; font-size:14px; }
  .confirm { background:#b91c1c33; border:1px solid #b91c1c; color:#eee; }
  .confirm:disabled { opacity:0.4; cursor:not-allowed; }
  .back { background:#1a1a1a; border:1px solid #666; color:#eee; }
</style>
</head>
<body>
  <div class="panel">
    <label style="font-size:12px;color:#999;display:block;margin-bottom:6px;">ルームコード</label>
    <input type="text" class="code-input" id="codeInput" placeholder="例: a1b2c3">
    <div class="hint">ルーム作成者から共有されたコードを入力してください</div>
    <div class="error" id="errorMsg"></div>
    <div class="actions">
      <button class="confirm" id="joinBtn" onclick="joinRoom()">参加する</button>
      <button class="back" onclick="location.href='title.html'">戻る</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/colyseus.js@0.15.24/dist/colyseus.js"></script>
  <script src="js/lfh-client.js"></script>
  <script>
    const codeInput = document.getElementById('codeInput');
    const joinBtn = document.getElementById('joinBtn');
    const errorMsg = document.getElementById('errorMsg');

    codeInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') joinRoom();
    });

    async function joinRoom() {
      const code = codeInput.value.trim();
      if (!code) {
        errorMsg.textContent = 'コードを入力してください';
        return;
      }

      const name = localStorage.getItem('playerName') || 'プレイヤー1';
      joinBtn.disabled = true;
      errorMsg.textContent = '';

      try {
        await LFH.joinRoom(code, { name });
        localStorage.setItem('isGM', 'false');
        location.href = 'room-create.html';
      } catch (e) {
        console.error(e);
        errorMsg.textContent = 'ルームが見つからないか、既にゲームが開始されています';
        joinBtn.disabled = false;
      }
    }

    (function () {
      const nav = performance.getEntriesByType('navigation')[0];
      if (nav && nav.type === 'reload') {
        location.href = 'title.html';
      }
    })();
  </script>
</body>
</html>
