<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロストフルホールデム - 換金</title>
<style>
  body { margin:0; font-family: "Hiragino Sans", sans-serif; background:#0a0a0a; color:#e5e5e5; }
  .screen { position:relative; width:100%; height:100vh; box-sizing:border-box; overflow:hidden; }

  .back-tab { position:absolute; top:50%; left:0; transform:translateY(-50%); background:#141414; border:1px solid #666; border-left:none; border-radius:0 8px 8px 0; padding:16px 10px; writing-mode:vertical-rl; cursor:pointer; font-size:13px; color:#ccc; }

  .note { position:absolute; top:16px; right:16px; font-size:11px; color:#888; text-align:right; line-height:1.6; max-width:180px; }

  .panel { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#141414; border:1px solid #333; border-radius:10px; padding:20px; width:260px; text-align:center; }
  .figure { width:160px; height:220px; margin:0 auto 16px; border:1px dashed #444; border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative; }
  .figure svg { width:100px; height:180px; }
  .figure svg .lost { fill:#000; stroke:#000; }
  .figure svg .ok { fill:none; stroke:#e5e5e5; stroke-width:3; }

  .select-row { display:flex; gap:8px; align-items:center; }
  select { flex:1; background:#1a1a1a; border:1px solid #444; color:#eee; padding:8px; border-radius:4px; }
  .exchange-btn { background:#b91c1c33; border:1px solid #b91c1c; color:#eee; padding:8px 16px; border-radius:4px; cursor:pointer; }
</style>
</head>
<body>
  <div class="screen">
    <div class="back-tab" onclick="location.href='table.html'">戻る</div>

    <div class="note">全体図<br>パーツの残を確認<br>(換金済みの部位は黒く表示)</div>

    <div class="panel">
      <div class="figure">
        <!-- 人型のたたき台。指(左手)が黒=換金済みの例 -->
        <svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
          <circle class="ok" cx="50" cy="20" r="14"/>
          <line class="ok" x1="50" y1="34" x2="50" y2="110"/>
          <line class="ok" x1="50" y1="50" x2="15" y2="80"/>
          <line class="ok" x1="50" y1="50" x2="85" y2="80"/>
          <line class="lost" x1="15" y1="80" x2="8" y2="90" stroke-width="3"/>
          <line class="ok" x1="50" y1="110" x2="25" y2="170"/>
          <line class="ok" x1="50" y1="110" x2="75" y2="170"/>
        </svg>
      </div>
      <div class="select-row">
        <select>
          <option>指</option>
          <option>歯</option>
          <option>耳(左)</option>
          <option>耳(右)</option>
          <option>肺(左)</option>
          <option>肺(右)</option>
          <option>目(左)</option>
          <option>目(右)</option>
          <option>腕(左)</option>
          <option>腕(右)</option>
          <option>心臓</option>
        </select>
        <button class="exchange-btn" onclick="location.href='table.html'">換金</button>
      </div>
    </div>
  </div>
</body>
</html>
