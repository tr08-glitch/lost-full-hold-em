<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロストフルホールデム - 対戦卓</title>
<style>
  body { margin:0; font-family: "Hiragino Sans", sans-serif; background:#0a0a0a; color:#e5e5e5; }
  .screen { position:relative; width:100%; height:100vh; box-sizing:border-box; overflow:hidden; }

  .round-box { position:absolute; top:16px; left:16px; background:#141414; border:1px solid #444; border-radius:6px; padding:8px 14px; font-size:13px; }
  .round-box .val { color:#b91c1c; font-size:18px; font-weight:bold; }

  .opponents { position:absolute; top:16px; left:160px; right:70px; display:flex; gap:16px; }
  .opponent { flex:1; max-width:180px; background:#141414; border:1px solid #333; border-radius:6px; padding:10px; text-align:center; }
  .opponent .name { font-size:12px; color:#999; margin-bottom:6px; }
  .opponent .cards { height:70px; border:1px dashed #333; border-radius:4px; margin-bottom:8px; }
  .opponent .stat-line { font-size:11px; background:#1a1a1a; border:1px solid #333; border-radius:4px; padding:3px 6px; margin-top:4px; }
  .opponent .stat-line.red { color:#e05252; }

  .hand-area { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:flex-end; }
  .hand-card { width:60px; height:90px; background:#1a1a1a; border:1px solid #666; border-radius:6px; }
  .hand-label { position:absolute; bottom:90px; left:50%; transform:translateX(-50%); font-size:11px; color:#888; }

  .self-panel { position:absolute; bottom:16px; left:16px; background:#141414; border:1px solid #b91c1c; border-radius:8px; padding:12px; width:220px; }
  .self-panel .name { font-size:13px; color:#999; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .body-icon { width:32px; height:32px; border:1px solid #b91c1c; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; background:#b91c1c22; }
  .red-note { font-size:12px; color:#e05252; }
  .stat { background:#1a1a1a; border:1px solid #444; border-radius:4px; padding:4px 10px; font-size:13px; flex:1; }

  .exchange-tab { position:absolute; top:50%; right:0; transform:translateY(-50%); background:#141414; border:1px solid #b91c1c; border-right:none; border-radius:8px 0 0 8px; padding:16px 10px; writing-mode:vertical-rl; cursor:pointer; font-size:13px; color:#e05252; }
</style>
</head>
<body>
  <div class="screen">
    <div class="round-box">残りラウンド<br><span class="val">3</span></div>

    <div class="opponents">
      <div class="opponent">
        <div class="name">プレイヤー2</div>
        <div class="cards"></div>
        <div class="stat-line red">赤札(推定): 400</div>
        <div class="stat-line">チップ: 1200</div>
        <div class="stat-line">BET: 900</div>
      </div>
      <div class="opponent">
        <div class="name">プレイヤー3</div>
        <div class="cards"></div>
        <div class="stat-line red">赤札(推定): 250</div>
        <div class="stat-line">チップ: 850</div>
        <div class="stat-line">BET: 900</div>
      </div>
    </div>

    <div class="hand-label">手札</div>
    <div class="hand-area">
      <div class="hand-card"></div>
      <div class="hand-card"></div>
    </div>

    <div class="self-panel">
      <div class="name">プレイヤー1(自分)</div>
      <div class="row">
        <div class="body-icon" title="換金画面へ" onclick="location.href='exchange.html'">🩸</div>
        <div class="red-note">赤札(推定): 700</div>
      </div>
      <div class="row">
        <div class="stat">チップ: 700</div>
      </div>
      <div class="row">
        <div class="stat">BET: 900</div>
      </div>
    </div>

    <div class="exchange-tab" onclick="location.href='exchange.html'">換金へ</div>
  </div>
</body>
</html>
