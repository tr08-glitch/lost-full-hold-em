<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ロストフルホールデム - 対戦卓</title>
<style>
  body { margin:0; font-family: "Hiragino Sans", sans-serif; background:#0a0a0a; color:#e5e5e5; }
  .screen { position:relative; width:100%; height:100vh; box-sizing:border-box; overflow:hidden; }

  .round-box { position:absolute; top:16px; left:16px; background:#141414; border:1px solid #444; border-radius:6px; padding:8px 14px; font-size:13px; }
  .round-box .val { color:#b91c1c; font-size:18px; font-weight:bold; }

  .opponents { position:absolute; top:16px; left:160px; right:70px; display:flex; gap:16px; }
  .opponent { flex:1; max-width:180px; background:#141414; border:1px solid #333; border-radius:6px; padding:10px; text-align:center; }
  .opponent .name { font-size:12px; color:#999; margin-bottom:6px; }
  .opponent .cards { height:70px; border:1px dashed #333; border-radius:4px; margin-bottom:8px; }
  .opponent .stat-line { font-size:11px; background:#1a1a1a; border:1px solid #333; border-radius:4px; padding:3px 6px; margin-top:4px; }
  .opponent .stat-line.red { color:#e05252; }

  .hand-area { position:absolute; bottom:120px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:flex-end; }
  .hand-card { width:60px; height:90px; background:#1a1a1a; border:1px solid #666; border-radius:6px; }
  .hand-label { position:absolute; bottom:90px; left:50%; transform:translateX(-50%); font-size:11px; color:#888; }

  .self-panel { position:absolute; bottom:16px; left:16px; background:#141414; border:1px solid #b91c1c; border-radius:8px; padding:12px; width:220px; }
  .self-panel .name { font-size:13px; color:#999; margin-bottom:8px; }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .body-icon { width:32px; height:32px; border:1px solid #b91c1c; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer; background:#b91c1c22; }
  .red-note { font-size:12px; color:#e05252; }
  .stat { background:#1a1a1a; border:1px solid #444; border-radius:4px; padding:4px 10px; font-size:13px; flex:1; }

  .community-area { position:absolute; top:48%; left:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:24px; }
  .community-cards { display:flex; gap:6px; }
  .community-card { width:48px; height:72px; background:#1a1a1a; border:1px solid #555; border-radius:5px; }
  .deck-box { width:48px; height:72px; background:#1a1a1a; border:1px solid #b91c1c; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#e05252; text-align:center; }

  .used-box { width:48px; height:72px; background:#1a1a1a; border:1px dashed #555; border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:11px; color:#777; text-align:center; }

  .exchange-tab { position:absolute; top:50%; right:0; transform:translateY(-50%); background:#141414; border:1px solid #b91c1c; border-right:none; border-radius:8px 0 0 8px; padding:16px 10px; writing-mode:vertical-rl; cursor:pointer; font-size:13px; color:#e05252; z-index:5; }

  .drawer-overlay { position:absolute; inset:0; background:#000000aa; opacity:0; pointer-events:none; transition:opacity .25s; z-index:8; }
  .drawer-overlay.open { opacity:1; pointer-events:auto; }

  .exchange-drawer { position:absolute; top:0; right:0; height:100%; width:340px; max-width:88%; background:#141414; border-left:1px solid #b91c1c; box-shadow:-8px 0 24px #000000aa; transform:translateX(100%); transition:transform .3s ease; z-index:9; padding:20px; box-sizing:border-box; }
  .exchange-drawer.open { transform:translateX(0); }
  .drawer-close { position:absolute; top:12px; left:12px; cursor:pointer; color:#ccc; font-size:13px; border:1px solid #666; border-radius:4px; padding:4px 10px; }
  .drawer-note { font-size:11px; color:#888; text-align:right; line-height:1.6; margin-bottom:8px; }
  .drawer-figure { width:150px; height:200px; margin:40px auto 16px; border:1px dashed #444; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .drawer-figure svg { width:90px; height:160px; }
  .drawer-figure svg .lost { fill:#000; stroke:#000; }
  .drawer-figure svg .ok { fill:none; stroke:#e5e5e5; stroke-width:3; }
  .drawer-select-row { display:flex; gap:8px; align-items:center; }
  .drawer-select-row select { flex:1; background:#1a1a1a; border:1px solid #444; color:#eee; padding:8px; border-radius:4px; }
  .drawer-exchange-btn { background:#b91c1c33; border:1px solid #b91c1c; color:#eee; padding:8px 16px; border-radius:4px; cursor:pointer; }

  .action-bar { position:absolute; bottom:16px; right:16px; display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; z-index:5; }
  .action-btn { background:#1a1a1a; border:1px solid #666; color:#eee; padding:12px 16px; border-radius:6px; cursor:pointer; font-size:13px; white-space:nowrap; }
  .action-btn:disabled { opacity:.35; cursor:not-allowed; }
  .action-btn.raise { border-color:#e0a752; color:#e0a752; }
  .action-btn.fold { border-color:#3b4d9e; color:#6f83e0; background:#151a33; }
  .action-btn.allin { border-color:#d4b400; color:#e6c700; background:#2a2408; }
  .action-btn.lostin { border-color:#5a0a0a; color:#c93a3a; background:#220505; font-weight:bold; }

  .center-modal-overlay { display:none; position:absolute; inset:0; background:#000000aa; align-items:center; justify-content:center; z-index:20; }
  .center-modal-overlay.open { display:flex; }
  .center-modal { background:#141414; border:1px solid #b91c1c; border-radius:10px; padding:22px; width:280px; text-align:center; }
  .center-modal p { font-size:14px; margin:0 0 18px; line-height:1.6; }
  .center-modal-actions { display:flex; gap:8px; }
  .center-modal-actions button { flex:1; padding:10px; border-radius:6px; cursor:pointer; background:#1a1a1a; border:1px solid #666; color:#eee; }
  .center-modal-actions button.confirm-yes { border-color:#b91c1c; color:#e05252; }

  .raise-modal { background:#141414; border:1px solid #e0a752; border-radius:10px; padding:22px; width:280px; }
  .raise-modal h3 { margin:0 0 16px; color:#e0a752; font-size:15px; }
  .raise-modal label { font-size:12px; color:#999; display:block; margin-bottom:6px; }
  .raise-modal input { width:100%; box-sizing:border-box; background:#1a1a1a; border:1px solid #444; color:#eee; padding:8px 10px; border-radius:4px; font-size:16px; }
  .raise-modal .range-note { font-size:11px; color:#777; margin-top:6px; }
  .raise-modal-actions { display:flex; gap:8px; margin-top:18px; }
  .raise-modal-actions button { flex:1; padding:10px; border-radius:6px; cursor:pointer; background:#1a1a1a; border:1px solid #666; color:#eee; }
  .raise-modal-actions button.confirm { border-color:#e0a752; color:#e0a752; }
</style>
</head>
<body>
  <div class="screen">
    <div class="round-box">残りラウンド<br><span class="val">3</span></div>

    <div class="opponents">
      <div class="opponent">
        <div class="name">プレイヤー2</div>
        <div class="cards"></div>
        <div class="stat-line red">赤札(推定): 400</div>
        <div class="stat-line">チップ: 1200</div>
        <div class="stat-line">BET: 900</div>
      </div>
      <div class="opponent">
        <div class="name">プレイヤー3</div>
        <div class="cards"></div>
        <div class="stat-line red">赤札(推定): 250</div>
        <div class="stat-line">チップ: 850</div>
        <div class="stat-line">BET: 900</div>
      </div>
    </div>

    <div class="community-area">
      <div class="used-box">使用済</div>
      <div class="community-cards">
        <div class="community-card"></div>
        <div class="community-card"></div>
        <div class="community-card"></div>
        <div class="community-card"></div>
        <div class="community-card"></div>
      </div>
      <div class="deck-box">山札<br>39</div>
    </div>

    <div class="hand-label">ホールカード</div>
    <div class="hand-area">
      <div class="hand-card"></div>
      <div class="hand-card"></div>
    </div>

    <div class="self-panel">
      <div class="name">プレイヤー1(自分)</div>
      <div class="row">
        <div class="body-icon" title="換金画面へ" onclick="openExchange()">🩸</div>
        <div class="red-note">赤札(推定): 700</div>
      </div>
      <div class="row">
        <div class="stat">チップ: 700</div>
      </div>
      <div class="row">
        <div class="stat">BET: 900</div>
      </div>
    </div>

    <div class="exchange-tab" onclick="openExchange()">換金へ</div>

    <div class="action-bar">
      <button class="action-btn" id="btnCheck" onclick="doCheck()">チェック</button>
      <button class="action-btn raise" id="btnRaise" onclick="openRaise()">レイズ</button>
      <button class="action-btn" id="btnCall" onclick="doCall()">コール</button>
      <button class="action-btn allin" id="btnAllin" onclick="confirmAction('allin')">オールイン</button>
      <button class="action-btn lostin" id="btnLostin" onclick="confirmAction('lostin')">ロストイン</button>
      <button class="action-btn fold" id="btnFold" onclick="confirmAction('fold')">フォールド</button>
    </div>

    <div class="center-modal-overlay" id="confirmOverlay">
      <div class="center-modal">
        <p id="confirmMessage">本当にフォールドしますか?</p>
        <div class="center-modal-actions">
          <button onclick="closeConfirm()">キャンセル</button>
          <button class="confirm-yes" onclick="executeConfirmedAction()">実行</button>
        </div>
      </div>
    </div>

    <div class="center-modal-overlay" id="raiseOverlay">
      <div class="raise-modal">
        <h3>レイズ</h3>
        <label>レイズする量</label>
        <input type="number" id="raiseAmount" value="900" step="10">
        <div class="range-note">最大 <span id="raiseMax">1800</span>(現在のBETの2倍まで)</div>
        <div class="raise-modal-actions">
          <button onclick="closeRaise()">キャンセル</button>
          <button class="confirm" onclick="confirmRaise()">確定</button>
        </div>
      </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" onclick="closeExchange()"></div>
    <div class="exchange-drawer" id="exchangeDrawer">
      <div class="drawer-close" onclick="closeExchange()">戻る</div>
      <div class="drawer-note">全体図<br>パーツの残を確認<br>(換金済みの部位は黒く表示)</div>
      <div class="drawer-figure">
        <svg viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg">
          <circle class="ok" cx="50" cy="20" r="14"/>
          <line class="ok" x1="50" y1="34" x2="50" y2="110"/>
          <line class="ok" x1="50" y1="50" x2="15" y2="80"/>
          <line class="ok" x1="50" y1="50" x2="85" y2="80"/>
          <line class="lost" x1="15" y1="80" x2="8" y2="90" stroke-width="3"/>
          <line class="ok" x1="50" y1="110" x2="25" y2="170"/>
          <line class="ok" x1="50" y1="110" x2="75" y2="170"/>
        </svg>
      </div>
      <div class="drawer-select-row">
        <select>
          <option>指</option>
          <option>歯</option>
          <option>耳(左)</option>
          <option>耳(右)</option>
          <option>肺(左)</option>
          <option>肺(右)</option>
          <option>目(左)</option>
          <option>目(右)</option>
          <option>腕(左)</option>
          <option>腕(右)</option>
          <option>心臓</option>
        </select>
        <button class="drawer-exchange-btn" onclick="closeExchange()">換金</button>
      </div>
    </div>
  </div>
  <script>
    function openExchange() {
      document.getElementById('exchangeDrawer').classList.add('open');
      document.getElementById('drawerOverlay').classList.add('open');
    }
    function closeExchange() {
      document.getElementById('exchangeDrawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('open');
    }

    // --- アクションボタンの状態管理 ---
    // currentBet: 現在のラウンドでの最高ベット額 / myBet: 自分がこのラウンドで既に出している額
    // myBet < currentBet の場合「レイズが来ている(コール可能・チェック不可)」状態
    let currentBet = 900;
    let myBet = 900;

    function updateActionButtons() {
      const raisePending = myBet < currentBet;
      document.getElementById('btnCheck').disabled = raisePending;
      document.getElementById('btnCall').disabled = !raisePending;
    }
    updateActionButtons();

    function doCheck() {
      if (document.getElementById('btnCheck').disabled) return;
      // チェック処理(次のプレイヤーへターンを渡す想定)
    }
    function doCall() {
      if (document.getElementById('btnCall').disabled) return;
      myBet = currentBet;
      updateActionButtons();
    }

    // --- レイズパネル ---
    function openRaise() {
      const max = currentBet * 2;
      const input = document.getElementById('raiseAmount');
      input.max = max;
      input.value = Math.min(Number(input.value) || currentBet, max);
      document.getElementById('raiseMax').textContent = max;
      document.getElementById('raiseOverlay').classList.add('open');
    }
    function closeRaise() {
      document.getElementById('raiseOverlay').classList.remove('open');
    }
    function confirmRaise() {
      let amount = Number(document.getElementById('raiseAmount').value);
      const max = currentBet * 2;
      if (amount > max) amount = max;
      if (amount < 0) amount = 0;
      currentBet = amount;
      myBet = amount;
      updateActionButtons();
      closeRaise();
    }

    // --- フォールド・オールイン・ロストインの再確認 ---
    const confirmMessages = {
      fold: '本当にフォールドしますか?',
      allin: '本当にオールインしますか?',
      lostin: '本当にロストインしますか?(残りの身体パーツを全て失います)'
    };
    let pendingAction = null;

    function confirmAction(action) {
      pendingAction = action;
      document.getElementById('confirmMessage').textContent = confirmMessages[action];
      document.getElementById('confirmOverlay').classList.add('open');
    }
    function closeConfirm() {
      pendingAction = null;
      document.getElementById('confirmOverlay').classList.remove('open');
    }
    function executeConfirmedAction() {
      if (pendingAction === 'fold') {
        // フォールド処理
      } else if (pendingAction === 'allin') {
        // オールイン処理
      } else if (pendingAction === 'lostin') {
        // ロストイン処理(赤札提示フローへ)
      }
      closeConfirm();
    }

    (function() {
      const nav = performance.getEntriesByType('navigation')[0];
      if (nav && nav.type === 'reload') {
        location.href = 'title.html';
      }
    })();
  </script>
</body>
</html>
